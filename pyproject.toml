[project]
name = "claude-bar"
version = "1.2.1"
description = "macOS menu bar app showing your Claude.ai usage. Fork of BOUSHABAMohammed/claude-bar with opt-in auto-poll."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "BOUSHABAMohammed (upstream)" },
    { name = "Mantra (mntrspace fork)" },
]
keywords = ["claude", "anthropic", "usage", "menu-bar", "macos"]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi==0.14.0",
    "pyobjc-framework-Cocoa==12.1",
    "rookiepy==0.5.6",
    "rumps==0.4.0",
]

[project.scripts]
claude-bar = "claude_bar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
